# IP allow-list of the TLS edge (release profile), the open-source substitute for Mattermost's licensed IP filtering.
# nginx checks the rules top to bottom; the first match wins. Replace `allow all;` with your networks, e.g.
#   allow 10.0.0.0/8;        # office / VPN
#   allow 203.0.113.0/24;    # data centre egress
#   deny  all;
# then `docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.release.yml restart tls`.
# Behind a load balancer, add `set_real_ip_from <lb cidr>; real_ip_header X-Forwarded-For;` first.
allow all;
