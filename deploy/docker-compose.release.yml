# Release profile (CFG-01…13) as a compose override:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.release.yml in deploy/.env, then docker compose up -d
# Settings set through MM_* environment variables are locked: the console shows them read-only, so nobody can weaken
# the profile from the UI — change this file and `up --release` again. Verify with `node deploy/prove-encryption.mjs`.
# TLS: the `tls` service terminates https on :8443 with deploy/tls/{cert,key}.pem (self-signed, from
# `bash deploy/gen-cert.sh`, for local verification only). Production replaces the pair with a CA-issued certificate
# for SITE_URL's host (or puts its own terminator in front of `server` and drops this service), keeps HSTS, and does not
# expose :8065 (set API_PORT=127.0.0.1:8065 or remove the port mapping).
services:
  server:
    environment:
      MM_SERVICESETTINGS_SITEURL: ${SITE_URL:-https://localhost:8443}       # CFG-09
      MM_SERVICESETTINGS_TLSSTRICTTRANSPORT: "true"                          # CFG-09: HSTS (the tls edge sends it too)
      MM_SERVICESETTINGS_ALLOWCORSFROM: ${SITE_URL:-https://localhost:8443} CFG-10# CFG-10
      MM_RATELIMITSETTINGS_ENABLE: "true"                                    # CFG-01
      MM_RATELIMITSETTINGS_PERSEC: "10"
      MM_RATELIMITSETTINGS_MAXBURST: "100"
      MM_RATELIMITSETTINGS_VARYBYUSER: "true"
      MM_RATELIMITSETTINGS_VARYBYREMOTEADDR: "true"
      MM_SERVICESETTINGS_MAXIMUMLOGINATTEMPTS: "10"                          # CFG-02
      MM_PASSWORDSETTINGS_MINIMUMLENGTH: "12"                                # CFG-03
      MM_PASSWORDSETTINGS_LOWERCASE: "true"
      MM_PASSWORDSETTINGS_UPPERCASE: "true"
      MM_PASSWORDSETTINGS_NUMBER: "true"
      MM_SERVICESETTINGS_SESSIONLENGTHWEBINHOURS: "720"                      # CFG-04: 30 days
      MM_SERVICESETTINGS_SESSIONIDLETIMEOUTINMINUTES: "10080"                #         idle 7 days
      MM_SERVICESETTINGS_ENABLEMULTIFACTORAUTHENTICATION: "true"             # CFG-05: available, not enforced (PROF-51)
      MM_SERVICESETTINGS_ENFORCEMULTIFACTORAUTHENTICATION: "false"
      MM_LOGSETTINGS_ENABLEDIAGNOSTICS: "false"                              # CFG-06: no telemetry
      MM_SERVICESETTINGS_ENABLESECURITYFIXALERT: "false"                     # CFG-07: decision — air-gapped, no calls to mattermost.com
      MM_SERVICESETTINGS_ENABLEDEVELOPER: "false"                            # CFG-08
      MM_SERVICESETTINGS_ENABLETESTING: "false"
      MM_TEAMSETTINGS_ENABLEOPENSERVER: "false"                              # CFG-11: invite-only
      MM_TEAMSETTINGS_ENABLEUSERCREATION: "true"
      MM_FILESETTINGS_MAXFILESIZE: "52428800"                                # CFG-12: 50 MB
      MM_SERVICESETTINGS_ENABLELINKPREVIEWS: "false"                         # CFG-13: no server-side fetches of user links
      # AllowedUntrustedInternalConnections comes from SSO_INTERNAL_HOST in docker-compose.yml (empty by default).

  tls:
    image: nginx:1.27-alpine
    depends_on: [server]
    volumes:
      - ./nginx-tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx-allow.conf:/etc/nginx/allow.conf:ro          # IP allow-list (substitute for licensed IP filtering)
      - ./tls:/etc/nginx/tls:ro
    ports: ["${TLS_PORT:-8443}:8443"]
    restart: unless-stopped
