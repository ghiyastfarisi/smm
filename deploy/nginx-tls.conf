# TLS edge for the release profile (docker-compose.release.yml): terminates https on :8443 and hands everything to
# the server (stock web app, API, WebSocket). Certificate: deploy/tls/{cert,key}.pem from gen-cert.sh (self-signed,
# local verification); production installs a CA-issued pair with the same file names.
server_tokens off;
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
  listen 8443 ssl;
  http2 on;
  ssl_certificate     /etc/nginx/tls/cert.pem;
  ssl_certificate_key /etc/nginx/tls/key.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  client_max_body_size 50m;
  include /etc/nginx/allow.conf; # IP allow-list (deploy/nginx-allow.conf)

  # HSTS at the edge (the server also sends it with TLSStrictTransport=true: CFG-09). 1 year; add `preload` once the
  # production host is on the preload list.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  location / {
    proxy_pass http://server:8065;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https; # makes the server mark cookies Secure (app.GetProtocol)
    proxy_read_timeout 600s;
  }
}
