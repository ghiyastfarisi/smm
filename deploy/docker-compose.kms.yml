# KMS profile: OpenBAO as it runs in production instead of `-dev` (KEY-21, rc.3).
#   bash deploy/openbao/kms-setup.sh            first time: init, unseal, kv + secret, policy, AppRole, audit; then up
#   bash deploy/openbao/kms-setup.sh unseal     after every OpenBAO restart (3 of 5 key shares)
#   bash deploy/up.sh --kms [--release]         normal start once set up (fails closed while OpenBAO is sealed)
# The server authenticates with AppRole (role id + secret id from deploy/openbao/secrets/approle.env); no root
# token reaches the app container. openbao-init is a no-op here: the root secret is written once by kms-setup.sh.
services:
  openbao:
    command: ["server"]   # the image entrypoint adds -config=/openbao/config
    volumes:
      - ./openbao/kms.hcl:/openbao/config/kms.hcl:ro
      - openbao-data:/openbao/file
      - openbao-audit:/openbao/logs
    environment:
      BAO_ADDR: http://127.0.0.1:8200
    healthcheck:
      test: ["CMD", "bao", "status"]   # exit 2 while sealed or uninitialised → unhealthy → server does not start
      interval: 2s
      retries: 30

  openbao-init:
    entrypoint: ["true"]
    environment:
      BAO_TOKEN: ""

  server:
    env_file: [./openbao/secrets/approle.env]   # OPENBAO_ROLE_ID, OPENBAO_SECRET_ID (written by kms-setup.sh)
    environment:
      OPENBAO_TOKEN: ""                           # empty → keyring logs in with AppRole

volumes:
  openbao-data:
  openbao-audit:
