# Builds the smm server image (server + stock web app) and publishes it to GHCR:
#   ghcr.io/ghiyastfarisi/smm:<tag> and :latest on a v* tag; run by hand for a test build of a branch.
name: smm image
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tags
        run: |
          img=ghcr.io/${GITHUB_REPOSITORY,,}
          if [ "$GITHUB_REF_TYPE" = tag ]; then echo "tags=$img:$GITHUB_REF_NAME,$img:latest" >> "$GITHUB_OUTPUT"
          else echo "tags=$img:${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"; fi
      - uses: docker/build-push-action@v6
        with:
          context: server
          file: deploy/server.Dockerfile
          build-contexts: webapp=webapp
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          cache-from: type=gha
          cache-to: type=gha,mode=max
